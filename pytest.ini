[tool:pytest]
testpaths = tests
norecursedirs = .git
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    --cov=custom_components.luxor_living
    --cov-report=term-missing
markers =
    enable_socket: marks tests that require socket access

[pytest-socket]
disable_socket = false
