[tool:pytest]
testpaths = tests
norecursedirs = .git
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    --strict-markers
    --cov=custom_components.luxor_living
    --cov-report=term-missing
markers =
    enable_socket: marks tests that require socket access (skipped in CI/CD)
    smoke: marks quick smoke tests for PRs (fast subset of critical tests)
    integration: marks medium-length integration-like tests (subset for PRs)
    e2e: marks on-demand end-to-end style tests (manual / scheduled runs)