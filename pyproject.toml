[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luxor-living"
version = "1.1.11"
description = "Theben LUXORliving integration for Home Assistant"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Phil", email = "phil@example.com"}
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10.0",
    "defusedxml>=0.7.1",
    "voluptuous>=0.15.2",
    "xknx>=3.15.0",
]
keywords = ["home-assistant", "knx", "luxorliving", "theben"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Home Assistant",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/phil/luxorliving"
Documentation = "https://github.com/phil/luxorliving/docs"
Repository = "https://github.com/phil/luxorliving.git"
Issues = "https://github.com/phil/luxorliving/issues"

[project.optional-dependencies]
dev = [
    "homeassistant>=2026.4.4",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-homeassistant-custom-component>=0.13.325",
    "zeroconf",
    "black==26.5.1",
    "isort==7.0.0",
    "flake8==7.3.0",
    "flake8-docstrings==1.7.0",
    "pylint==4.0.5",
    "mypy==2.1.0",
    "types-requests==2.33.0.20260518",
    "radon==6.0.1",
    "bandit==1.9.4",
    "pre-commit==4.6.0",
    "pip-audit>=2.9.0",
]
mutation = [
    "mutmut>=3.3.1",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
py_version = "313"
skip_gitignore = true
known_first_party = ["custom_components"]
known_third_party = ["homeassistant", "xknx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -ra"
markers = [
    "asyncio: marks tests as async",
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "enable_socket: marks tests that require socket access (skipped in CI)",
    "smoke: marks quick smoke tests for PRs (fast subset of critical tests)",
    "e2e: marks on-demand end-to-end style tests (manual / scheduled runs)",
]

[tool.coverage.run]
branch = true
source = ["custom_components/luxor_living"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.mypy]
mypy_path = "custom_components"
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "xknx.*",
]
ignore_missing_imports = true

[tool.mutmut]
paths_to_mutate = ["custom_components/luxor_living"]
tests_dir = ["tests"]
pytest_add_cli_args = ["--ignore=tests/test_performance.py", "--ignore=tests/test_lxp_integration.py"]
pytest_add_cli_args_test_selection = ["-m", "smoke and not enable_socket"]
