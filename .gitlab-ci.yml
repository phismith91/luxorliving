stages:
  - test
  - quality
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python -V
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install -r requirements_dev.txt

test:
  stage: test
  script:
    - python -m pytest tests/ -v --tb=short --cov=custom_components.luxor_living --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

quality:
  stage: quality
  script:
    - black --check custom_components/luxor_living/ tests/
    - isort --check-only custom_components/luxor_living/ tests/
    - mypy custom_components/luxor_living/
    - ./scripts/validate_readme.sh
  only:
    - merge_requests
    - main

release:
  stage: release
  script:
    - echo "Release job - manual trigger only"
  only:
    - tags
  when: manual