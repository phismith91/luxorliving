name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt
        pip install -r requirements_style.txt

    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=custom_components.luxor_living --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-style-${{ hashFiles('**/requirements_style.txt') }}

    - name: Install style dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_style.txt

    - name: Check code formatting with Black
      run: python -m black --check --diff custom_components/ tests/

    - name: Check import sorting with isort
      run: python -m isort --check-only --diff custom_components/ tests/

    - name: Lint with flake8
      run: python -m flake8 custom_components/ tests/

    - name: Type check with mypy
      run: python -m mypy custom_components/

    - name: Check for security issues
      run: |
        pip install bandit
        python -m bandit -r custom_components/ -f json -o bandit-report.json || echo '{"runs": []}' > bandit-report.json
      continue-on-error: true

    - name: Upload security scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: bandit-report.json
      if: always()

  validate-hacs:
    name: Validate HACS Integration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate HACS
      uses: hacs/action@main
      with:
        category: integration

  performance-test:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt

    - name: Run performance benchmark
      run: |
        python -m custom_components.luxor_living.benchmark docs/Familie\ Schmidt_0.9.lxp

    - name: Store benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_results.json

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, code-quality, validate-hacs]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create ZIP for HACS
      run: |
        cd custom_components/luxor_living
        zip -r ../../luxor_living.zip .

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./luxor_living.zip
        asset_name: luxor_living.zip
        asset_content_type: application/zip