name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    release:
        types: [published]
    workflow_dispatch:

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
            python-version: ["3.13"]
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Cache pip dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_dev.txt
                  pip install -r requirements_style.txt

            - name: Run tests with coverage
              run: |
                  python -m pytest tests/ -v --tb=short --cov=custom_components.luxor_living --cov-report=term --cov-report=xml

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  file: ./coverage.xml
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

    quality:
        name: Code Quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_dev.txt
                  pip install -r requirements_style.txt

            - name: Run Black
              run: black --check custom_components/luxor_living/ tests/

            - name: Run isort
              run: isort --check-only custom_components/luxor_living/ tests/

            - name: Run mypy
              run: mypy custom_components/luxor_living/

            - name: Validate README
              run: ./scripts/validate_readme.sh

    release:
        name: Release
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_dev.txt

            - name: Run tests
              run: python -m pytest tests/ -v

            - name: Build package
              run: |
                  python -m pip install build
                  python -m build

            - name: Publish to PyPI
              if: github.event.action == 'published'
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  password: ${{ secrets.PYPI_API_TOKEN }}
