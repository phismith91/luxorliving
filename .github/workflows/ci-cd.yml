name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --cov=custom_components/luxor_living --cov-report=xml -m "not enable_socket"

      - name: Update test count badge in README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COUNT=$(python -m pytest tests/ --collect-only -q 2>&1 | grep "tests collected" | awk '{print $1}')
          if [ -n "$COUNT" ]; then
            sed -i "s|Tests-[0-9]*%20passing|Tests-${COUNT}%20passing|g" README.md
            sed -i "s|\[Tests: [0-9]*\]|\[Tests: ${COUNT}\]|g" README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git diff --quiet README.md || git commit -am "ci: update test count badge to ${COUNT} [skip ci]"
            git push
          fi

      - name: Update test count badge in README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COUNT=$(python -m pytest tests/ --collect-only -q 2>&1 | grep "tests collected" | awk '{print $1}')
          if [ -n "$COUNT" ]; then
            sed -i "s|Tests-[0-9]*%20passing-brightgreen\.svg|Tests-${COUNT}%20passing-brightgreen.svg|g" README.md
            sed -i "s|\[Tests: [0-9]*\]|\[Tests: ${COUNT}\]|g" README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git diff --quiet README.md || git commit -am "ci: update test count badge to ${COUNT} [skip ci]"
            git push
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
