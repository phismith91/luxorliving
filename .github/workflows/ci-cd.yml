name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: [self-hosted, docker]
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Python version
      run: python3 --version

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python3 --version
        python3 -m venv venv
        source venv/bin/activate
        python --version
        pip install --upgrade pip
        pip install -r requirements_dev.txt
        pip install -r requirements_style.txt

    - name: Run tests with coverage
      run: |
        source venv/bin/activate
        python -m pytest tests/ --cov=custom_components.luxor_living --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  code-quality:
    name: Code Quality Checks
    runs-on: [self-hosted, docker]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-style-${{ hashFiles('**/requirements_style.txt') }}

    - name: Install style dependencies
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements_style.txt

    - name: Check code formatting with Black
      run: |
        source venv/bin/activate
        python -m black --check --diff custom_components/ tests/

    - name: Check import sorting with isort
      run: |
        source venv/bin/activate
        python -m isort --check-only --diff custom_components/ tests/

    - name: Lint with flake8
      run: |
        source venv/bin/activate
        python -m flake8 custom_components/ tests/

    - name: Type check with mypy
      run: |
        source venv/bin/activate
        python -m mypy custom_components/

    - name: Check for security issues
      run: |
        source venv/bin/activate
        pip install bandit
        python -m bandit -r custom_components/ -f json -o bandit-report.json || echo '{"runs": []}' > bandit-report.json
      continue-on-error: true

    - name: Upload security scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: bandit-report.json
      if: always()

  validate-hacs:
    name: Validate HACS Integration
    runs-on: [self-hosted, docker]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate HACS manifest
      run: |
        python3 -c "
        import json
        import os
        import sys
        
        # Load manifest
        with open('custom_components/luxor_living/manifest.json', 'r') as f:
            manifest = json.load(f)
        
        # Basic validation
        required_fields = ['domain', 'name', 'version', 'codeowners', 'requirements', 'iot_class']
        for field in required_fields:
            if field not in manifest:
                print(f'ERROR: Missing required field: {field}')
                sys.exit(1)
        
        # Check hacs.json
        with open('hacs.json', 'r') as f:
            hacs = json.load(f)
        
        if hacs.get('name') != manifest['domain']:
            print('ERROR: hacs.json name does not match manifest domain')
            sys.exit(1)
        
        print('HACS validation passed')
        "

  performance-test:
    name: Performance Benchmark
    runs-on: [self-hosted, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements_dev.txt

    - name: Run performance benchmark
      run: |
        source venv/bin/activate
        python -m custom_components.luxor_living.benchmark docs/Familie\ Schmidt_0.9.lxp

    - name: Store benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_results.json

  release:
    name: Create Release
    runs-on: [self-hosted, docker]
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [test, code-quality, validate-hacs]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create ZIP for HACS
      run: |
        cd custom_components/luxor_living
        zip -r ../../luxor_living.zip .

    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./luxor_living.zip
        asset_name: luxor_living.zip
        asset_content_type: application/zip