name: QA Matrix Report

on:
  workflow_run:
    workflows: ["QA Matrix (Gold compliance)"]
    types:
      - completed

jobs:
  report:
    name: Post QA Matrix Report to PR
    runs-on: ubuntu-latest
    steps:
      - name: Post summary comment for PRs
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = context.payload.workflow_run.conclusion
            const url = context.payload.workflow_run.html_url
            const prs = context.payload.workflow_run.pull_requests || []
            for (const pr of prs) {
              const body = `QA Matrix run **${conclusion}**. See details: ${url}`
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              })
            }
