name: Validate

# push limited to main — an unrestricted push trigger alongside pull_request
# ran hacs/hassfest twice per PR-branch push.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"

  validate-hassfest:
    runs-on: ubuntu-latest
    needs: validate-hacs
    continue-on-error: true # ghcr.io Docker pulls fail intermittently; don't block PRs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
