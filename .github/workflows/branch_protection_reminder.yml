name: Branch Protection Reminder

on:
  pull_request:
    types: [opened, reopened]

jobs:
  remind:
    name: Branch protection reminder
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check if PR is from a fork
        id: fork
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Post reminder comment
        if: steps.fork.outputs.is_fork == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.pull_request;
            await github.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `:information_source: Reminder: please ensure branch protection for **main** is configured before merging.

See the recommended settings in 
- docs/BRANCH_PROTECTION.md

An admin can apply them using \\
- \\`scripts/apply_branch_protection.sh\\` (requires repo admin rights and the GitHub CLI).\\n
If you want me to run the full QA Matrix for this PR, comment with \"/run-qa-matrix\" or add the \\`run-qa-matrix\\` label.`
            });