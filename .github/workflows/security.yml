name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC

jobs:
  bandit:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r custom_components/luxor_living/ \
            -f json -o bandit-report.json \
            --exit-zero
          bandit -r custom_components/luxor_living/ \
            --severity-level medium

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements_dev.txt
          pip install pip-audit

      - name: Run pip-audit and check for unexpected vulnerabilities
        run: |
          pip-audit --desc --format json > pip-audit-report.json || true
          # Allowlist for known, tracked vulnerabilities we cannot fix here
          ALLOWED_CVES="CVE-2025-67221"
          python - <<'PY'
import json, sys
try:
    data = json.load(open('pip-audit-report.json'))
except Exception:
    print('No JSON report produced by pip-audit; falling back to text output.')
    sys.exit(0)

vulns = data.get('vulnerabilities') or []
# Normalize id field (some outputs use 'id' or 'vuln_id')
others = []
for v in vulns:
    vid = v.get('id') or v.get('vuln_id') or ''
    if vid and vid not in ALLOWED_CVES.split():
        others.append({'id': vid, 'package': v.get('name')})
if others:
    print('Unexpected vulnerabilities found:', others, file=sys.stderr)
    sys.exit(1)
print('Only allowed/known vulnerabilities present or none.')
PY

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [bandit, dependency-audit]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Python code security scan (bandit)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency vulnerability scan (pip-audit)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
