name: Auto PR from release/* to main

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create_pr:
    name: Create PR for release → main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR if missing (skip when .no-auto-pr present)
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/','');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = 'main';

            // Opt-out: skip if .no-auto-pr file exists in branch
            try {
              await github.rest.repos.getContent({ owner, repo, path: '.no-auto-pr', ref: branch });
              core.info('.no-auto-pr found in branch; skipping PR creation');
              return;
            } catch (e) {
              // Not found -> continue
            }

            // Check for existing open PRs from this branch to main
            const { data: pulls } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base, state: 'open' });
            if (pulls.length > 0) {
              core.info(`Open PR already exists: ${pulls[0].html_url}`);
              return;
            }

            const title = `chore(release): merge ${branch} → ${base}`;
            const body = `Automated PR to merge release branch **${branch}** into **${base}**.\n\nThis PR was created automatically by CI because a release branch was pushed. Please ensure CI checks pass and merge when ready.`;

            const pr = await github.rest.pulls.create({ owner, repo, head: branch, base, title, body });
            core.info(`Created PR: ${pr.data.html_url}`);
