name: Mutation Tests

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutmut:
    name: Mutation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mutation]"

      - name: Run mutmut
        run: mutmut run

      - name: Check surviving mutants
        run: |
          RESULTS="$(mutmut results)"
          printf '%s\n' "$RESULTS" | tee mutmut-results.txt
          if [ -n "$RESULTS" ]; then
            echo "❌ Mutation survivors detected"
            exit 1
          fi
          echo "✅ No surviving mutants reported"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: mutmut-results.txt
