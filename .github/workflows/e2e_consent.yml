name: "E2E: Consent tests (on-demand)"

on:
  workflow_dispatch: {}
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  e2e-consent:
    name: E2E Consent (manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      - name: "Run E2E consent tests (marker: e2e)"
        run: |
          python -m pytest tests/ -q -m "e2e and not enable_socket"

      - name: Upload e2e test logs
        uses: actions/upload-artifact@v7
        with:
          name: e2e-consent-logs
          path: ./
