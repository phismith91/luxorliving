name: Dependabot PR Validation

on:
    pull_request:
        branches: [main]

jobs:
    dependabot-validation:
        name: Validate Dependabot PRs
        runs-on: ubuntu-latest
        if: github.actor == 'dependabot[bot]'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Cache pip dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_dev.txt
                  pip install -r requirements_style.txt

            - name: Run tests
              run: python -m pytest tests/ -v --tb=short

            - name: Run Black
              run: black --check custom_components/luxor_living/ tests/

            - name: Run isort
              run: isort --check-only custom_components/luxor_living/ tests/

            - name: Validate README
              run: ./scripts/validate_readme.sh

            - name: Auto-approve Dependabot PR
              if: success()
              uses: juliangruber/approve-pull-request-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  number: ${{ github.event.pull_request.number }}
