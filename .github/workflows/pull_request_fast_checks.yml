name: Pull Request — Fast checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  statuses: write

jobs:
  fast-checks:
    name: Fast (lint + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements_dev.txt
            requirements_style.txt

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key:
            ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt')
            }}-python-3.13
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install style tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_style.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_dev.txt

      - name: Formatting check (black)
        run: |
          black --check custom_components tests scripts || (echo "Run 'black .' locally" && exit 1)

      - name: Import sorting check (isort)
        run: |
          isort --check-only custom_components tests scripts || (echo "Run 'isort .' locally" && exit 1)

      - name: Quick smoke tests
        run: |
          python -m pytest tests/ -q -m "smoke and not enable_socket"

      - name: Ensure required status present
        uses: actions/github-script@v8
        with:
          script: |
            // For pull_request events this is available on the payload
            const sha = context.payload.pull_request ? context.payload.pull_request.head.sha : process.env.GITHUB_SHA;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: 'success',
              context: 'Pull Request — Fast checks',
              description: 'Automated: Pull Request — Fast checks reported success',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
