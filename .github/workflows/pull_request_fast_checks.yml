name: Pull Request — Fast checks

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    fast-checks:
        name: Fast (lint + smoke)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}-python-3.13
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Install style tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements_style.txt

            - name: Install test dependencies
              run: |
                  python -m pip install -r requirements_dev.txt

            - name: Formatting check (black)
              run: |
                  black --check custom_components tests scripts || (echo "Run 'black .' locally" && exit 1)

            - name: Import sorting check (isort)
              run: |
                  isort --check-only custom_components tests scripts || (echo "Run 'isort .' locally" && exit 1)

            - name: Quick smoke tests
              run: |
                  python -m pytest tests/ -q -m "smoke and not enable_socket"
