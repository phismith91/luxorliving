name: Release Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Purpose: Verify tests and release readiness before allowing merges to main.
# This workflow runs: smoke & integration tests, HACS validation, release notes verification,
# and shell scripts linting. Format checks run in PR workflows to keep this lean.

permissions:
  contents: read

jobs:
  release_checks:
    name: Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Home Assistant >=2025.12 requires Python 3.13+; use 3.13 for reliable installs
          python-version: "3.14"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Quick smoke tests
        run: |
          python -m pytest tests/ -q -m "smoke and not enable_socket"

      - name: Integration subset tests
        run: |
          python -m pytest tests/ -q -m "integration and not enable_socket"

      - name: Run README validation
        run: ./scripts/validate_readme.sh

      - name: Check version references
        run: ./scripts/check_version_refs.sh

      - name: HACS validation
        run: ./scripts/validate_hacs.sh

      - name: Check release notes file exists
        run: ./scripts/check_release_notes.sh

      - name: Run release automation dry-run
        run: ./scripts/release_automation.sh --dry-run
        env:
          # If you need to authenticate gh in workflow, set GITHUB_TOKEN in repo settings
          GITHUB_TOKEN:

      - name: Run ShellCheck (blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"
        # Pinned action; ShellCheck failures are now blocking to enforce script quality

      - name: Enforce Gold Gates (manual check)
        run: |
          echo "Gold Gates enforced: smoke + integration subset + HACS validation + release dry-run must be green before merge" && exit 0
