name: Release Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  release_checks:
    name: Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install formatters (black, isort) and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt
          python -m pip install black isort

      - name: Quick smoke tests
        run: |
          ./venv/bin/python -m pytest tests/ -q -m "smoke and not enable_socket"

      - name: Integration subset tests
        run: |
          ./venv/bin/python -m pytest tests/ -q -m "integration and not enable_socket"

      - name: Run README validation
        run: ./scripts/validate_readme.sh

      - name: HACS validation
        run: ./scripts/validate_hacs.sh

      - name: Check release notes file exists
        run: ./scripts/check_release_notes.sh

      - name: Run release automation dry-run
        run: ./scripts/release_automation.sh --dry-run
        env:
          # If you need to authenticate gh in workflow, set GITHUB_TOKEN in repo settings
          GITHUB_TOKEN: 

      - name: Run ShellCheck (blocking)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts'
        # Pinned action; ShellCheck failures are now blocking to enforce script quality

      - name: Enforce Gold Gates (manual check)
        run: |
          echo "Gold Gates enforced: smoke + integration subset + HACS validation + release dry-run must be green before merge" && exit 0

